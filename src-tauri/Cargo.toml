[package]
name = "vault-task"
version = "0.4.0"
description = "VaultTask — encrypted tray task manager with Markdown notes"
license = "MIT OR Apache-2.0"
authors = ["you"]
edition = "2024"

[lib]
name = "vault_task_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Enables tauri::test (mock runtime + IPC harness) for unit tests only.
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
zbus = "5"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tauri-plugin-dialog = "2"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
ureq = "3"
semver = "1"
minisign-verify = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# sync-secret-service: D-Bus Secret Service (GNOME Keyring / KWallet);
# crypto-rust: pure-Rust bus encryption (no OpenSSL); vendored: static
# libdbus so builders need no extra system packages.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
