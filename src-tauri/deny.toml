# cargo-deny configuration for VaultTask (license: MIT OR Apache-2.0)
# Checked in CI (`deny` job in .github/workflows/ci.yml).

[advisories]
# Defaults: fail on vulnerabilities/yanked via the RustSec advisory DB.
# The ignores below are all "unmaintained" (not vulnerable) with no safe
# upgrade available:
# - proc-macro-error arrives via glib-macros -> gtk (gtk-rs tree pinned by
#   Tauri's tray-icon dependency).
# - zvariant / zbus_names / zvariant_derive are the zbus 5 wire-format
#   crates, unmaintained as standalones since zbus 6; Tauri 2.x pins zbus 5.
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
# Dependencies must be permissive / weak-copyleft only — no GPL/AGPL/SSPL.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    # Permissive data license for the Mozilla CA bundle (webpki-root-certs,
    # via rustls/updater dependency chain).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are near-unavoidable in Cargo trees — warn, don't fail.
multiple-versions = "warn"
# Our own manifests pin explicit versions; keep it that way.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
