name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Least privilege: only the publish job needs write, and only on tags.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: tag matches package versions
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: check versions
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CARGO_VER=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          TAURI_VER=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          NPM_VER=$(grep '"version"' package.json | head -1 | cut -d'"' -f4)
          echo "tag=$TAG cargo=$CARGO_VER tauri_conf=$TAURI_VER npm=$NPM_VER"
          [ "v$CARGO_VER" = "$TAG" ] || { echo "tag does not match Cargo version"; exit 1; }
          [ "v$TAURI_VER" = "$TAG" ] || { echo "tag does not match tauri.conf.json version"; exit 1; }
          [ "v$NPM_VER" = "$TAG" ] || { echo "tag does not match package.json version"; exit 1; }

  build-windows:
    name: bundle msi,nsis on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: NSIS + WiX
        run: choco install nsis wixtoolset -y
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: build bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-Windows
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/latest.json
          if-no-files-found: error

  build-ubuntu:
    name: bundle deb,appimage on ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: system deps (Tauri WebKitGTK + bundling tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: build bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-Ubuntu
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/latest.json
          if-no-files-found: error

  build-fedora:
    name: bundle rpm for fedora
    # The rpm targets Fedora (webkit2gtk4.1 + libappindicator-gtk3 deps in
    # tauri.conf.json) but is produced by the pure-Rust bundler, so it can
    # build on an Ubuntu host — no rpmbuild needed, only the `rpm` CLI to
    # verify the package requirements below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: system deps (Tauri WebKitGTK + rpm inspector)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: build rpm bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles rpm
      - name: verify fedora rpm dependencies
        shell: bash
        run: |
          RPM=$(ls src-tauri/target/release/bundle/rpm/*.rpm)
          echo "rpm=$RPM"
          rpm -qpR "$RPM"
          rpm -qpR "$RPM" | grep -q webkit2gtk4.1 || { echo "missing webkit2gtk4.1 requirement"; exit 1; }
          rpm -qpR "$RPM" | grep -q libappindicator-gtk3 || { echo "missing libappindicator-gtk3 requirement"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-Fedora
          path: src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error

  publish:
    name: publish release
    needs: [preflight, build-windows, build-ubuntu, build-fedora]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundles-*
          merge-multiple: true
      # Each platform build emits its own latest.json (single-platform entry).
      # Merge them BEFORE flattening (identical filenames would collide).
      - name: merge updater manifests
        shell: bash
        run: |
          mapfile -t MANIFESTS < <(find artifacts -mindepth 2 -name latest.json | sort)
          echo "manifests: ${MANIFESTS[*]}"
          [ "${#MANIFESTS[@]}" -ge 1 ] || { echo "no latest.json found"; exit 1; }
          jq -s '{version: .[0].version, notes: .[0].notes, pub_date: .[0].pub_date, platforms: (map(.platforms) | add)}' \
            "${MANIFESTS[@]}" > artifacts/latest.json
          # Release notes for the in-app updater, from this version's CHANGELOG section.
          VER=$(jq -r .version artifacts/latest.json)
          NOTES=$(awk "/^## \[$VER\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md | head -c 4000)
          [ -n "$NOTES" ] || NOTES="VaultTask $VER — see GitHub Releases for details."
          jq --arg notes "$NOTES" '.notes = $notes' artifacts/latest.json > artifacts/latest.json.new
          mv artifacts/latest.json.new artifacts/latest.json
          jq -e '.platforms | length >= 1' artifacts/latest.json
          cat artifacts/latest.json
          rm "${MANIFESTS[@]}"
      - name: flatten per-format subdirectories
        shell: bash
        run: |
          find artifacts -mindepth 2 -type f -exec mv -t artifacts/ {} +
          ls -la artifacts/
      - name: generate SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.msi *.exe *.deb *.rpm *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
