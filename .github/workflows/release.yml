name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Least privilege: only the publish job needs write, and only on tags.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: tag matches package versions
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: check versions
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CARGO_VER=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          TAURI_VER=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          NPM_VER=$(grep '"version"' package.json | head -1 | cut -d'"' -f4)
          echo "tag=$TAG cargo=$CARGO_VER tauri_conf=$TAURI_VER npm=$NPM_VER"
          [ "v$CARGO_VER" = "$TAG" ] || { echo "tag does not match Cargo version"; exit 1; }
          [ "v$TAURI_VER" = "$TAG" ] || { echo "tag does not match tauri.conf.json version"; exit 1; }
          [ "v$NPM_VER" = "$TAG" ] || { echo "tag does not match package.json version"; exit 1; }

  build-windows:
    name: bundle msi,nsis on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: NSIS + WiX
        run: choco install nsis wixtoolset -y
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: build bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-Windows
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

  build-ubuntu:
    name: bundle deb,appimage on ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: system deps (Tauri WebKitGTK + bundling tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: build bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-Ubuntu
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

  build-fedora:
    name: bundle rpm for fedora
    # The rpm targets Fedora (webkit2gtk4.1 + libappindicator-gtk3 deps in
    # tauri.conf.json) but is produced by the pure-Rust bundler, so it can
    # build on an Ubuntu host — no rpmbuild needed, only the `rpm` CLI to
    # verify the package requirements below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: system deps (Tauri WebKitGTK + rpm inspector)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: build rpm bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles rpm
      - name: verify fedora rpm dependencies
        shell: bash
        run: |
          RPM=$(ls src-tauri/target/release/bundle/rpm/*.rpm)
          echo "rpm=$RPM"
          rpm -qpR "$RPM"
          rpm -qpR "$RPM" | grep -q webkit2gtk4.1 || { echo "missing webkit2gtk4.1 requirement"; exit 1; }
          rpm -qpR "$RPM" | grep -q libappindicator-gtk3 || { echo "missing libappindicator-gtk3 requirement"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-Fedora
          path: src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error

  publish:
    name: publish release
    needs: [preflight, build-windows, build-ubuntu, build-fedora]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundles-*
          merge-multiple: true
      - name: flatten per-format subdirectories
        shell: bash
        run: |
          find artifacts -mindepth 2 -type f -exec mv -t artifacts/ {} +
          ls -la artifacts/
      - name: generate SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.msi *.exe *.deb *.rpm *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # tauri-bundler signs updater targets (nsis/appimage/deb/msi) but NOT
      # the rpm — and the Fedora upload only ships *.rpm. Sign it here with
      # the same release key so the PackageKit flow can verify it in-app.
      # (Safe pattern: secret via env, never interpolated into the script.)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: sign rpm for package updates
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -u
          mapfile -t RPMS < <(ls artifacts/*.rpm)
          [ "${#RPMS[@]}" -eq 1 ] || { echo "expected 1 rpm, found ${#RPMS[@]}"; exit 1; }
          npx -y @tauri-apps/cli@2 signer sign "${RPMS[0]}"
          [ -f "${RPMS[0]}.sig" ] || { echo "rpm signing produced no .sig"; exit 1; }
      # The bundler usually signs the msi itself (updater target) — but only
      # the assisted flow consumes it now, so guarantee a .sig either way.
      - name: sign msi for assisted updates
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -u
          mapfile -t MSIS < <(ls artifacts/*.msi)
          [ "${#MSIS[@]}" -eq 1 ] || { echo "expected 1 msi, found ${#MSIS[@]}"; exit 1; }
          if [ ! -f "${MSIS[0]}.sig" ]; then
            npx -y @tauri-apps/cli@2 signer sign "${MSIS[0]}"
          fi
          [ -f "${MSIS[0]}.sig" ] || { echo "msi signing produced no .sig"; exit 1; }
      # The v2 updater installs bundles directly (nsis/appimage are
      # self-contained), so the bundler emits only .sig sidecars — no
      # latest.json. Generate the manifest here (tauri-action style):
      # signatures are the raw .sig bytes, URLs are per-tag downloads.
      # Lenient by design: each platform/package is included only when its
      # artifact + .sig are present, so the release can ship any bundle
      # subset without breaking the manifests (full matrix: msi + nsis
      # + deb + rpm + appimage).
      - name: generate updater manifest
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -u
          VER="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES=$(awk "/^## \\[$VER\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md | head -c 4000)
          [ -n "$NOTES" ] || NOTES="VaultTask $VER — see GitHub Releases for details."
          DL="https://github.com/$REPO/releases/download/$TAG"
          # Collect at most one match per glob; empty when absent.
          one() { ls $1 2>/dev/null | head -n 1; }
          PLATFORMS='{}'
          add_platform() { # $1=platform key $2=artifact file
            local key="$1" file="$2"
            [ -n "$file" ] || { echo "skip $key: no artifact"; return 0; }
            [ -f "$file.sig" ] || { echo "missing $file.sig"; exit 1; }
            PLATFORMS=$(jq --arg k "$key" --arg s "$(cat "$file.sig")" \
              --arg u "$DL/$(basename "$file")" \
              '. + {($k): {signature: $s, url: $u}}' <<<"$PLATFORMS")
          }
          add_platform "windows-x86_64" "$(one 'artifacts/*-setup.exe')"
          add_platform "linux-x86_64" "$(one 'artifacts/*.AppImage')"
          jq -n \
            --arg version "$VER" --arg notes "$NOTES" --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: $platforms}' \
            > artifacts/latest.json
          jq -e '.version and (.platforms | type == "object")' artifacts/latest.json
          cat artifacts/latest.json
          # Native packages for the in-app PackageKit flow (rpm/deb can't
          # ride latest.json — the plugin schema has fixed platform keys).
          PACKAGES='{}'
          add_package() { # $1=key $2=file
            local key="$1" file="$2"
            [ -n "$file" ] || { echo "skip $key: no artifact"; return 0; }
            [ -f "$file.sig" ] || { echo "missing $file.sig"; exit 1; }
            PACKAGES=$(jq --arg k "$key" --arg s "$(cat "$file.sig")" \
              --arg u "$DL/$(basename "$file")" \
              '. + {($k): {signature: $s, url: $u}}' <<<"$PACKAGES")
          }
          add_package "rpm" "$(one 'artifacts/*.rpm')"
          add_package "deb" "$(one 'artifacts/*.deb')"
          [ "$(jq '. | length' <<<"$PACKAGES")" -ge 1 ] || { echo "no native packages found"; exit 1; }
          jq -n \
            --arg version "$VER" --arg notes "$NOTES" --arg pub_date "$PUB_DATE" \
            --argjson packages "$PACKAGES" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              packages: $packages}' \
            > artifacts/linux-packages.json
          jq -e '.version and (.packages | length >= 1)' artifacts/linux-packages.json
          jq '{version, pub_date, keys: (.packages | keys)}' artifacts/linux-packages.json
          # Windows twin for the MSI assisted flow (same schema, msi key).
          WIN_PACKAGES='{}'
          add_win_package() { # $1=key $2=file
            local key="$1" file="$2"
            [ -n "$file" ] || { echo "skip $key: no artifact"; return 0; }
            [ -f "$file.sig" ] || { echo "missing $file.sig"; exit 1; }
            WIN_PACKAGES=$(jq --arg k "$key" --arg s "$(cat "$file.sig")" \
              --arg u "$DL/$(basename "$file")" \
              '. + {($k): {signature: $s, url: $u}}' <<<"$WIN_PACKAGES")
          }
          add_win_package "msi" "$(one 'artifacts/*.msi')"
          [ "$(jq '. | length' <<<"$WIN_PACKAGES")" -ge 1 ] || { echo "no windows packages found"; exit 1; }
          jq -n \
            --arg version "$VER" --arg notes "$NOTES" --arg pub_date "$PUB_DATE" \
            --argjson packages "$WIN_PACKAGES" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              packages: $packages}' \
            > artifacts/windows-packages.json
          jq -e '.version and (.packages | length >= 1)' artifacts/windows-packages.json
          jq '{version, pub_date, keys: (.packages | keys)}' artifacts/windows-packages.json
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
