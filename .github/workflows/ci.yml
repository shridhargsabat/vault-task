name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least privilege: all jobs only check out and build, so read-only contents.
permissions:
  contents: read

jobs:
  rust:
    name: test + clippy + fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: system deps (Tauri WebKitGTK + appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: src-tauri
        run: cargo test

  frontend:
    name: typecheck + vite build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  test-windows:
    name: test windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
      # TEMPORARY: diagnose STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139).
      - name: diagnose missing imports
        if: failure()
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/lucasg/Dependencies/releases/download/v1.11.1/Dependencies_x64_Release.zip -OutFile deps.zip
          Expand-Archive deps.zip -DestinationPath deps
          $exe = Get-ChildItem src-tauri/target/debug/deps/vault_task_lib-*.exe | Select-Object -First 1
          Write-Host "exe=$($exe.FullName)"
          .\deps\Dependencies.exe -chain $exe.FullName
          Write-Host "=== direct imports ==="
          .\deps\Dependencies.exe -imports $exe.FullName | Select-String -Pattern '\(\!\)|Missing|Error' | Select-Object -First 40
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: check advisories + licenses + bans
        working-directory: src-tauri
        run: cargo deny check
