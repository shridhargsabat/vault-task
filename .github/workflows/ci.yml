name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least privilege: all jobs only check out and build, so read-only contents.
permissions:
  contents: read

jobs:
  rust:
    name: test + clippy + fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: system deps (Tauri WebKitGTK + appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: src-tauri
        run: cargo test

  frontend:
    name: typecheck + vite build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  test-windows:
    name: test windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
      # TEMPORARY: find the exact missing import behind 0xc0000139.
      - name: find missing imports
        if: failure()
        shell: python
        run: |
          import glob, os, subprocess, sys
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "-q", "pefile"]
          )
          import pefile
          exe = glob.glob(
              "src-tauri/target/debug/deps/vault_task_lib-*.exe"
          )[0]
          print("exe:", exe)
          pe = pefile.PE(exe)
          sysdir = os.path.join(os.environ["SystemRoot"], "System32")
          exports_cache = {}
          total_missing = 0
          for entry in pe.DIRECTORY_ENTRY_IMPORT:
              dll = entry.dll.decode()
              path = os.path.join(sysdir, dll)
              if not os.path.exists(path):
                  # Api-set virtual DLL (api-ms-*/ext-ms-*) or delay-load:
                  # resolved by the loader, skip.
                  continue
              if dll not in exports_cache:
                  dpe = pefile.PE(path)
                  names = set()
                  if hasattr(dpe, "DIRECTORY_ENTRY_EXPORT"):
                      for sym in dpe.DIRECTORY_ENTRY_EXPORT.symbols:
                          if sym.name:
                              names.add(sym.name.decode())
                  exports_cache[dll] = (names, dpe)
              names, dpe = exports_cache[dll]
              for imp in entry.imports:
                  if imp.name and imp.name.decode() not in names:
                      print(f"MISSING: {dll}!{imp.name.decode()}")
                      total_missing += 1
          print("total missing:", total_missing)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: check advisories + licenses + bans
        working-directory: src-tauri
        run: cargo deny check
